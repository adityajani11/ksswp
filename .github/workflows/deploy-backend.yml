name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/app

            echo "Pulling latest code..."
            if [ ! -d ".git" ]; then
              git clone https://github.com/adityajani11/ksswp.git .
            else
              git fetch origin
              git reset --hard origin/main
            fi

            cd server

            echo "Installing backend dependencies..."
            npm install

            echo "Starting / Restarting backend with PM2..."
            pm2 describe kss-backend > /dev/null \
              && pm2 restart kss-backend \
              || pm2 start index.js --name kss-backend

            pm2 save
