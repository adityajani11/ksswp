name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "client/**"

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5 # ✅ updated

      - name: Setup Node
        uses: actions/setup-node@v5 # ✅ updated
        with:
          node-version: 22 # ✅ better than 18 (future-safe)
          cache: "npm" # 🚀 speed boost

      - name: Install & Build
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Upload dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "client/dist/*"
          target: "/var/www/app-client"
          strip_components: 2
